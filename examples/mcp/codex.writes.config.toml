# Optional writable registration. Original examples remain read-only.
# Replace executable and DLL placeholders locally; do not commit personal paths.
[mcp_servers.activity-explorer]
command = "dotnet"
args = ["/absolute/path/to/artifacts/mcp/ActivityExplorer.Mcp.dll"]

[mcp_servers.activity-explorer.env]
ACTIVITY_EXPLORER_DATA = "/absolute/path/to/existing/data"
Mcp__AccessMode = "ReadWrite"
Mcp__AllowedWriteProfileIds__0 = "11111111-1111-4111-8111-111111111111"
Mcp__AllowDestructive = "false"
Mcp__AllowAdministration = "false"
# The Web app must independently grant these capabilities and profiles.
